# experiment_gae.yaml
# Reference config for E_main experiment.
# NOT loaded automatically — only when explicitly passed to ConfigReader.merge().
# run_main.py uses defaults.yaml only.

model:
  name: "gae"
  hidden_dim: 64
  latent_dim: 16

graph:
  metric: "wpli_aec_combined"
  alpha: 0.5

training:
  seed: 42
  max_epochs: 200